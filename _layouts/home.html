---
layout: default
---

<div class="home-grid">
  <div class="profile-text">
    <h1>{{ page.title }}</h1>
    <div class="profile-role">{{ page.role | markdownify }}</div>
  </div>
  <div class="profile-photo">
  {% if page.headshot and page.headshot != '' %}
  <img class="headshot" src="{{ page.headshot | relative_url }}" alt="{{ page.headshot_alt | escape }}" width="6000" height="4000">
  {% else %}
  <div class="headshot headshot-placeholder" role="img" aria-label="Headshot placeholder">
    <span>Your headshot</span>
  </div>
  {% endif %}
  </div>

{{ content }}
</div>
